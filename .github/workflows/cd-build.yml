name: CD-Build

on:
  push:
    branches: [ stable ]

env:
  VERSION: 3.0.0-preview.${{github.run_number}}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5.2.0
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/MinimalCli.sln
      # build solution here instead of project
    - name: Build Minimal Command Line
      run: dotnet build src/MinimalCli.sln -c Release --no-restore
      
      # packs all nuget packages at once 
    - name: Pack Minimal Command Line Nuget Alpha
      run: dotnet pack src/MinimalCli/MinimalCli.csproj -p:PackageVersion=${VERSION}-alpha -o ./packages 
    - name: Pack Minimal Command Line Template Nuget Alpha
      run: dotnet pack src/MinimalCli.Templates/MinimalCli.Templates.csproj -p:PackageVersion=${VERSION}-alpha -o ./packages 
    - name: Pack Minimal Command Line Nuget
      run: dotnet pack src/MinimalCli/MinimalCli.csproj -p:PackageVersion=${VERSION} -o ./packages 
    - name: Pack Minimal Command Line Template Nuget
      run: dotnet pack src/MinimalCli.Templates/MinimalCli.Templates.csproj -p:PackageVersion=${VERSION} -o ./packages 

    - name: Publish Minimal Command Line Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: Nugets
        path: packages/*.nupkg
        
  integration:
    needs: build
    name: Deploy Nuget-alpha packages
    environment:
      name: Integration
    runs-on: ubuntu-22.04
    permissions:
      id-token: write 
      contents: read
    steps:

    - name: Download nugets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: Nugets

    - name: nuget-logon
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 #v1.2.0
      id: login
      with:
        user: dotnetKyle
        
    - name: Display structure of downloaded files
      run: ls -R
    - name: Push Minimal Command Line Nuget
      run: dotnet nuget push ./MinimalCli.${VERSION}-alpha.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
    - name: Push Minimal Command Line Template Nuget
      run: dotnet nuget push ./MinimalCli.Templates.${VERSION}-alpha.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  production:
    needs: integration
    name: Deploy Nuget packages to production
    environment:
      name: Production
    runs-on: ubuntu-22.04
    permissions:
      id-token: write 
      contents: read
    steps:

    - name: Download nugets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: Nugets

    - name: nuget-logon
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 #v1.2.0
      id: login
      with:
        user: dotnetKyle

    - name: Push Minimal Command Line Nuget
      run: dotnet nuget push ./MinimalCli.${VERSION}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
    - name: Push Minimal Command Line Template Nuget
      run: dotnet nuget push ./MinimalCli.Templates.${VERSION}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
